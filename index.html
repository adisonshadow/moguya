<html lang="zh-CN" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />

      http-equiv="Content-Security-Policy"

    />
    <title>蘑菇鸭 - 图片编辑</title>
    <link rel="stylesheet" href="./iconfont/iconfont.css" />
  </head>
